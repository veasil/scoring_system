<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 伍力全开</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #667eea;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5a6fd8;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .hint {
            color: #666;
            font-size: 14px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .hint a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .hint a:hover {
            text-decoration: underline;
        }

        .field-hint {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }

        .invite-code-input {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🎮</div>
        <h1>注册伍力全开</h1>
        <p class="subtitle">请填写以下信息完成注册</p>

        <form id="register-form">
            <div class="form-group">
                <label for="invite-code">邀请码 *</label>
                <input type="text" id="invite-code" class="invite-code-input"
                    placeholder="请输入邀请码" maxlength="20" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="phone">手机号 *</label>
                <input type="tel" id="phone" placeholder="请输入手机号" required autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="real-name">真实姓名 *</label>
                <input type="text" id="real-name" placeholder="请输入真实姓名" maxlength="20" required>
            </div>

            <div class="form-group">
                <label for="nickname">守望师名 *</label>
                <input type="text" id="nickname" placeholder="游戏中显示的昵称" maxlength="20" required>
                <div class="field-hint">将用于游戏记录和复盘报告</div>
            </div>

            <div class="form-group">
                <label for="password">密码 *</label>
                <input type="password" id="password" placeholder="至少6位" minlength="6" required>
                <div class="field-hint">密码至少需要6位字符</div>
            </div>

            <div class="form-group">
                <label for="confirm-password">确认密码 *</label>
                <input type="password" id="confirm-password" placeholder="再次输入密码" required>
            </div>

            <button type="submit" class="btn" id="submit-btn">注册</button>
            <div id="error-message" class="error"></div>
        </form>

        <p class="hint">
            已有账号？<a href="/">返回登录</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.textContent = '';

            const code = document.getElementById('invite-code').value.trim().toUpperCase();
            const phone = document.getElementById('phone').value.trim();
            const realName = document.getElementById('real-name').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!code) { errorMessage.textContent = '请输入邀请码'; return; }
            if (!phone) { errorMessage.textContent = '请输入手机号'; return; }
            if (!realName) { errorMessage.textContent = '请输入真实姓名'; return; }
            if (!nickname) { errorMessage.textContent = '请输入守望师名'; return; }
            if (password.length < 6) { errorMessage.textContent = '密码至少需要6位'; return; }
            if (password !== confirmPassword) { errorMessage.textContent = '两次密码输入不一致'; return; }

            submitBtn.disabled = true;
            submitBtn.textContent = '注册中...';

            try {
                const response = await fetch('/api/auth/register-with-invite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, phone, realName, nickname, password })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || '注册失败');
                }

                // 保存登录状态，回到首页时自动登录
                localStorage.setItem('WQT_AUTH_TOKEN', data.token);
                if (data.user) {
                    localStorage.setItem('WQT_USER_CACHE', JSON.stringify(data.user));
                }
                sessionStorage.setItem('skip_intro', 'true');

                submitBtn.textContent = '注册成功！正在跳转...';
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } catch (err) {
                errorMessage.textContent = err.message;
                submitBtn.disabled = false;
                submitBtn.textContent = '注册';
            }
        });

        // 清除错误提示
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => { errorMessage.textContent = ''; });
        });
    </script>
</body>

</html>
