
# Staging Environment - HTTPS via www.ai5000days.com/staging/
# 
# 本配置用于将 /staging/ 路径代理到测试服后端 (内部端口 3001)。
# 
# 使用方法:
#   将下方 location 块添加到 www.ai5000days.com 的 HTTPS server 块中。
#   不需要作为独立的 server 块使用。
#
# 在服务器上执行:
#   1. 编辑正式服的 Nginx 配置文件 (通常在 /etc/nginx/sites-available/ 下)
#   2. 在现有的 server { listen 443 ssl; server_name www.ai5000days.com; ... } 块中添加:

# --- 添加到 www.ai5000days.com 的 HTTPS server 块中 (443 端口) ---

# 测试服 - 路径前缀代理 (此部分需手动添加到主 HTTPS server 块中)
# location /staging/ {
#     proxy_pass http://127.0.0.1:3001/;  # 末尾斜杠: 去掉 /staging/ 前缀
#     proxy_http_version 1.1;
#     proxy_set_header Upgrade $http_upgrade;
#     proxy_set_header Connection 'upgrade';
#     proxy_set_header Host $host;
#     proxy_cache_bypass $http_upgrade;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
# }

# --- 同时保留 8081 端口直连 (可选, 方便内部调试) ---
# 如果希望同时保留 IP:8081 的 HTTP 访问方式, 保持下方块不变:

server {
    listen 8081;
    server_name _; # Responds to IP:8081 or Domain:8081

    access_log /var/log/nginx/wqt-staging.access.log;
    error_log /var/log/nginx/wqt-staging.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001; # Proxy to Node app on internal port 3001
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
